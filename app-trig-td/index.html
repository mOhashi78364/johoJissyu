<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>三角比タワーディフェンス</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    /* ===================================================
       三角比タワーディフェンス 固有スタイル
       =================================================== */
    :root {
      --td-bg: #0f172a;
      --td-panel: #1e293b;
      --td-border: #334155;
      --td-text: #f8fafc;
      --td-muted: #94a3b8;
      --td-pos-bg: #1e3a8a;
      --td-pos-border: #3b82f6;
      --td-pos-text: #eff6ff;
      --td-neg-bg: #4c1d95;
      --td-neg-border: #8b5cf6;
      --td-neg-text: #f5f3ff;
      --td-zero-bg: #065f46;
      --td-zero-border: #10b981;
      --td-none-bg: #7c2d12;
      --td-none-border: #f97316;
      --td-danger: #ef4444;
      --td-accent: #38bdf8;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: var(--td-bg);
      color: var(--td-text);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .trig-td-app {
      width: 100%;
      max-width: 520px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background-color: var(--td-bg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 32px rgba(0, 0, 0, 0.5);
    }

    /* 1. ヘッダー（約10%） */
    .td-header {
      height: 10%;
      min-height: 54px;
      max-height: 76px;
      padding: env(safe-area-inset-top, 6px) 14px 6px;
      background-color: var(--td-panel);
      border-bottom: 2px solid var(--td-border);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .td-stat-box {
      display: flex;
      flex-direction: column;
    }

    .td-stat-box.right {
      align-items: flex-end;
    }

    .td-stat-label {
      font-size: 0.7rem;
      color: var(--td-muted);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .td-wave-text {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--td-accent);
    }

    .td-life-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 1.35rem;
      letter-spacing: 2px;
      color: var(--td-danger);
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.45);
    }

    .td-heart.lost {
      color: #475569;
      text-shadow: none;
    }

    .td-score-wrap {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .td-score-text {
      font-family: "Courier New", Consolas, monospace;
      font-size: 1.2rem;
      font-weight: 800;
      color: #facc15;
    }

    .td-combo-badge {
      font-size: 0.75rem;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 1px 6px;
      border-radius: 999px;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .td-combo-badge.active {
      opacity: 1;
      transform: scale(1);
    }

    /* 2. 防衛フィールド（約50%） */
    .td-field {
      position: relative;
      height: 50%;
      flex: 1 1 50%;
      width: 100%;
      background:
        radial-gradient(circle at 50% 100%, rgba(56, 189, 248, 0.12), transparent 65%),
        linear-gradient(180deg, #090d16 0%, #0f172a 75%, #172554 100%);
      overflow: hidden;
    }

    /* 背景グリッド装飾 */
    .td-field::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
    }

    .td-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Waveアナウンスオーバーレイ */
    .td-banner {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--td-accent);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.35);
      padding: 10px 24px;
      border-radius: 12px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 5;
      white-space: nowrap;
    }

    .td-banner.visible {
      opacity: 1;
    }

    .td-banner-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--td-accent);
      letter-spacing: 0.08em;
      display: block;
    }

    .td-banner-sub {
      font-size: 0.8rem;
      color: var(--td-muted);
      margin-top: 2px;
      display: block;
    }

    /* スタート待機画面オーバーレイ（フィールド内） */
    .td-start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.78);
      backdrop-filter: blur(3px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 14px;
      z-index: 15;
      text-align: center;
      transition: opacity 0.2s ease;
    }

    .td-start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .td-start-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--td-accent);
      margin: 0;
      letter-spacing: 0.04em;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .td-start-desc {
      font-size: 0.85rem;
      color: var(--td-text);
      line-height: 1.5;
      margin: 0;
      max-width: 300px;
    }

    .td-start-btn {
      min-width: 210px;
      min-height: 52px;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #ffffff;
      border: 2px solid #93c5fd;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
      transition: transform 0.08s ease, filter 0.1s ease;
    }

    .td-start-btn:active {
      transform: scale(0.96);
      filter: brightness(1.1);
    }

    /* ダメージ・誤答時のフラッシュ＆シェイク演出 */
    .td-flash-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(239, 68, 68, 0.38);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 8;
    }

    .td-flash-overlay.active {
      opacity: 1;
    }

    @keyframes td-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .trig-td-app.shake {
      animation: td-shake 0.28s ease-in-out;
    }

    /* 3. キーパッド（約40%・4列×4行グリッド） */
    .td-keypad-section {
      height: 40%;
      min-height: 230px;
      padding: 10px 10px calc(env(safe-area-inset-bottom, 8px) + 8px);
      background-color: var(--td-panel);
      border-top: 2px solid var(--td-border);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
    }

    .td-keypad-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 7px;
      width: 100%;
      height: 100%;
    }

    .td-key {
      position: relative;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: 800;
      font-family: "Poppins", "Noto Sans JP", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.06s ease, filter 0.1s ease, opacity 0.15s ease;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
      padding: 0 2px;
      line-height: 1.1;
    }

    .td-key:active:not(:disabled),
    .td-key.pressed:not(:disabled) {
      transform: translateY(2px) scale(0.97);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      filter: brightness(1.18);
    }

    /* 正の値ボタン（ブルー系） */
    .td-key--pos {
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      border: 2px solid #60a5fa;
      color: var(--td-pos-text);
    }

    /* 負の値ボタン（パープル・マゼンタ系で明確に区別） */
    .td-key--neg {
      background: linear-gradient(180deg, #7c3aed 0%, #5b21b6 100%);
      border: 2px solid #c084fc;
      color: var(--td-neg-text);
    }

    /* 0 ボタン（エメラルド系アクセント） */
    .td-key--zero {
      background: linear-gradient(180deg, #059669 0%, #047857 100%);
      border: 2px solid #34d399;
      color: #ecfdf5;
    }

    /* なし（未定義）ボタン（アンバー・オレンジ系） */
    .td-key--none {
      background: linear-gradient(180deg, #ea580c 0%, #c2410c 100%);
      border: 2px solid #fb923c;
      color: #fff7ed;
      font-size: 1.05rem;
    }

    /* 空きマス（ブランク・非活性） */
    .td-key--blank {
      visibility: hidden;
      pointer-events: none;
    }

    /* クールダウン（ペナルティ0.4秒間無効化） */
    .td-keypad-grid.cooldown .td-key {
      opacity: 0.42;
      filter: grayscale(0.5);
      pointer-events: none;
    }

    /* 4. リザルトモーダル */
    .td-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .td-modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .td-modal {
      width: 100%;
      max-height: 90dvh;
      background-color: var(--td-panel);
      border: 2px solid var(--td-border);
      border-radius: 16px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow-y: auto;
    }

    .td-modal-header {
      text-align: center;
    }

    .td-result-status {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0;
      letter-spacing: 0.05em;
    }

    .td-result-status.clear {
      color: #34d399;
    }

    .td-result-status.gameover {
      color: #f87171;
    }

    .td-rank-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: rgba(15, 23, 42, 0.65);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--td-border);
    }

    .td-rank-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .td-rank-char {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1;
      color: #facc15;
      text-shadow: 0 0 14px rgba(250, 204, 21, 0.45);
    }

    .td-score-summary {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: right;
    }

    .td-total-score {
      font-family: "Courier New", Consolas, monospace;
      font-size: 1.7rem;
      font-weight: 800;
      color: #f8fafc;
    }

    .td-score-detail {
      font-size: 0.78rem;
      color: var(--td-muted);
    }

    .td-weak-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .td-weak-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--td-muted);
      margin: 0;
    }

    .td-weak-list {
      list-style: none;
      margin: 0;
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--td-border);
      border-radius: 10px;
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .td-weak-item {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .td-weak-empty {
      color: #34d399;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 2px;
    }

    .td-retry-btn {
      width: 100%;
      min-height: 50px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: 1px solid #60a5fa;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .td-retry-btn:active {
      transform: scale(0.98);
    }

    @media (max-height: 640px) {
      .td-key {
        font-size: 1rem;
      }
      .td-life-box {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <main class="trig-td-app" id="trigTdApp">
    <!-- 1. ヘッダー（約10%） -->
    <header class="td-header" aria-label="ゲームステータス">
      <div class="td-stat-box">
        <span class="td-stat-label">WAVE</span>
        <span class="td-wave-text" id="tdWaveDisplay">Wave 1/5</span>
      </div>

      <div class="td-life-box" id="tdLifeDisplay" aria-label="残りライフ">
        <span class="td-heart">♥</span>
        <span class="td-heart">♥</span>
        <span class="td-heart">♥</span>
      </div>

      <div class="td-stat-box right">
        <span class="td-stat-label">SCORE</span>
        <div class="td-score-wrap">
          <span class="td-combo-badge" id="tdComboBadge">0 COMBO</span>
          <span class="td-score-text" id="tdScoreDisplay">0</span>
        </div>
      </div>
    </header>

    <!-- 2. 防衛フィールド（約50%） -->
    <section class="td-field" id="tdField" aria-label="防衛フィールド">
      <canvas class="td-canvas" id="tdCanvas"></canvas>

      <div class="td-start-overlay" id="tdStartOverlay">
        <h1 class="td-start-title">三角比タワーディフェンス</h1>
        <p class="td-start-desc">迫りくる三角比（0°〜180°）の値を<br>下のキーパッドで素早くタップして迎撃しよう！</p>
        <button type="button" class="btn td-start-btn" id="tdStartBtn">ゲームスタート</button>
      </div>

      <div class="td-banner" id="tdBanner" aria-live="polite">
        <span class="td-banner-title" id="tdBannerTitle">WAVE 1</span>
        <span class="td-banner-sub" id="tdBannerSub">鋭角・直角（0°〜90°）</span>
      </div>

      <div class="td-flash-overlay" id="tdFlashOverlay"></div>
    </section>

    <!-- 3. キーパッド（約40%・4列×4行グリッド） -->
    <section class="td-keypad-section" aria-label="解答キーパッド">
      <div class="td-keypad-grid" id="tdKeypadGrid">
        <!-- 1行目（正の sin/cos・小→大）: 1/2 | 1/√2 | √3/2 | 1 -->
        <button type="button" class="td-key td-key--pos" data-value="1/2">1/2</button>
        <button type="button" class="td-key td-key--pos" data-value="1/√2">1/√2</button>
        <button type="button" class="td-key td-key--pos" data-value="√3/2">√3/2</button>
        <button type="button" class="td-key td-key--pos" data-value="1">1</button>

        <!-- 2行目（負の sin/cos・1行目と上下ペア）: -1/2 | -1/√2 | -√3/2 | -1 -->
        <button type="button" class="td-key td-key--neg" data-value="-1/2">-1/2</button>
        <button type="button" class="td-key td-key--neg" data-value="-1/√2">-1/√2</button>
        <button type="button" class="td-key td-key--neg" data-value="-√3/2">-√3/2</button>
        <button type="button" class="td-key td-key--neg" data-value="-1">-1</button>

        <!-- 3行目（正の tan・小→大 ＆ 0）: 1/√3 | √3 | (空き) | 0 -->
        <button type="button" class="td-key td-key--pos" data-value="1/√3">1/√3</button>
        <button type="button" class="td-key td-key--pos" data-value="√3">√3</button>
        <span class="td-key td-key--blank" aria-hidden="true"></span>
        <button type="button" class="td-key td-key--zero" data-value="0">0</button>

        <!-- 4行目（負の tan・3行目と上下ペア ＆ なし）: -1/√3 | -√3 | (空き) | なし -->
        <button type="button" class="td-key td-key--neg" data-value="-1/√3">-1/√3</button>
        <button type="button" class="td-key td-key--neg" data-value="-√3">-√3</button>
        <span class="td-key td-key--blank" aria-hidden="true"></span>
        <button type="button" class="td-key td-key--none" data-value="なし">なし</button>
      </div>
    </section>

    <!-- 4. リザルト画面（モーダル） -->
    <div class="td-modal-backdrop" id="tdResultModal" role="dialog" aria-modal="true" aria-labelledby="tdResultTitle">
      <div class="td-modal">
        <div class="td-modal-header">
          <h2 class="td-result-status" id="tdResultTitle">MISSION COMPLETE</h2>
        </div>

        <div class="td-rank-row">
          <div class="td-rank-badge">
            <span class="td-stat-label">RANK</span>
            <span class="td-rank-char" id="tdResultRank">S</span>
          </div>
          <div class="td-score-summary">
            <span class="td-stat-label">TOTAL SCORE</span>
            <span class="td-total-score" id="tdResultTotalScore">0</span>
            <span class="td-score-detail" id="tdResultBreakdown">撃破: 0 / 0 | 最大コンボ: 0 | 残HP: 3</span>
          </div>
        </div>

        <div class="td-weak-section">
          <h3 class="td-weak-title">苦手だった三角比（誤答・突破された問題）</h3>
          <ul class="td-weak-list" id="tdWeakList"></ul>
        </div>

        <button type="button" class="btn td-retry-btn" id="tdRetryBtn">もう一度プレイ</button>
      </div>
    </div>
  </main>

  <script>
    (() => {
      /**
       * 三角比タワーディフェンス ゲーム管理クラス
       */
      class TrigTowerDefense {
        constructor() {
          // 全27パターンの出題マスターデータ定義
          this.masterQuestions = [
            // sin (9パターン)
            { func: 'sin', angle: 0, answer: '0' },
            { func: 'sin', angle: 30, answer: '1/2' },
            { func: 'sin', angle: 45, answer: '1/√2' },
            { func: 'sin', angle: 60, answer: '√3/2' },
            { func: 'sin', angle: 90, answer: '1' },
            { func: 'sin', angle: 120, answer: '√3/2' },
            { func: 'sin', angle: 135, answer: '1/√2' },
            { func: 'sin', angle: 150, answer: '1/2' },
            { func: 'sin', angle: 180, answer: '0' },
            // cos (9パターン)
            { func: 'cos', angle: 0, answer: '1' },
            { func: 'cos', angle: 30, answer: '√3/2' },
            { func: 'cos', angle: 45, answer: '1/√2' },
            { func: 'cos', angle: 60, answer: '1/2' },
            { func: 'cos', angle: 90, answer: '0' },
            { func: 'cos', angle: 120, answer: '-1/2' },
            { func: 'cos', angle: 135, answer: '-1/√2' },
            { func: 'cos', angle: 150, answer: '-√3/2' },
            { func: 'cos', angle: 180, answer: '-1' },
            // tan (9パターン)
            { func: 'tan', angle: 0, answer: '0' },
            { func: 'tan', angle: 30, answer: '1/√3' },
            { func: 'tan', angle: 45, answer: '1' },
            { func: 'tan', angle: 60, answer: '√3' },
            { func: 'tan', angle: 90, answer: 'なし' },
            { func: 'tan', angle: 120, answer: '-√3' },
            { func: 'tan', angle: 135, answer: '-1' },
            { func: 'tan', angle: 150, answer: '-1/√3' },
            { func: 'tan', angle: 180, answer: '0' }
          ].map((q) => ({
            ...q,
            label: `${q.func} ${q.angle}°`
          }));

          // Wave設定（全5段階、各Wave 10〜15問、落下速度微増）
          // Wave 1は0〜90°のみ（tan 90°の未定義を除く）、Wave 2以降で鈍角・tan未定義を追加
          this.waveConfigs = [
            { wave: 1, count: 10, speed: 20, spawnInterval: 3400, desc: '0°〜90°の基本角' },
            { wave: 2, count: 11, speed: 23, spawnInterval: 3200, desc: '鈍角・tan 90°が出現！' },
            { wave: 3, count: 12, speed: 26, spawnInterval: 3000, desc: '全域（0°〜180°）迎撃戦' },
            { wave: 4, count: 13, speed: 29, spawnInterval: 2800, desc: '接近フェーズ' },
            { wave: 5, count: 15, speed: 32, spawnInterval: 2600, desc: '最終防衛ライン死守' }
          ];

          // DOM要素の取得
          this.appEl = document.getElementById('trigTdApp');
          this.fieldEl = document.getElementById('tdField');
          this.canvas = document.getElementById('tdCanvas');
          this.ctx = this.canvas.getContext('2d');
          this.waveDisplay = document.getElementById('tdWaveDisplay');
          this.lifeDisplay = document.getElementById('tdLifeDisplay');
          this.scoreDisplay = document.getElementById('tdScoreDisplay');
          this.comboBadge = document.getElementById('tdComboBadge');
          this.bannerEl = document.getElementById('tdBanner');
          this.bannerTitleEl = document.getElementById('tdBannerTitle');
          this.bannerSubEl = document.getElementById('tdBannerSub');
          this.flashOverlay = document.getElementById('tdFlashOverlay');
          this.keypadGrid = document.getElementById('tdKeypadGrid');
          this.resultModal = document.getElementById('tdResultModal');
          this.resultTitle = document.getElementById('tdResultTitle');
          this.resultRank = document.getElementById('tdResultRank');
          this.resultTotalScore = document.getElementById('tdResultTotalScore');
          this.resultBreakdown = document.getElementById('tdResultBreakdown');
          this.weakListEl = document.getElementById('tdWeakList');
          this.retryBtn = document.getElementById('tdRetryBtn');
          this.startOverlay = document.getElementById('tdStartOverlay');
          this.startBtn = document.getElementById('tdStartBtn');

          // 内部状態
          this.width = 0;
          this.height = 0;
          this.defenseLineY = 0;
          this.rafId = null;
          this.lastTimestamp = 0;
          this.cooldownTimer = null;
          this.bannerTimer = null;
          this.isPlaying = false;

          this.bindEvents();
          this.resizeCanvas();
          this.initStandby();
        }

        /**
         * イベントリスナー登録（pointerdownでスマホタップ遅延を防止）
         */
        bindEvents() {
          window.addEventListener('resize', () => {
            this.resizeCanvas();
            if (!this.isPlaying) {
              this.render();
            }
          });

          const keys = this.keypadGrid.querySelectorAll('.td-key[data-value]');
          keys.forEach((btn) => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              const val = btn.getAttribute('data-value');
              btn.classList.add('pressed');
              this.handleInput(val);
            });
            const clearPressed = () => btn.classList.remove('pressed');
            btn.addEventListener('pointerup', clearPressed);
            btn.addEventListener('pointercancel', clearPressed);
            btn.addEventListener('pointerleave', clearPressed);
          });

          this.startBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.resetGame();
          });

          this.retryBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.resetGame();
          });
        }

        /**
         * Canvasサイズと防衛ライン座標の更新
         */
        resizeCanvas() {
          const rect = this.fieldEl.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          this.width = rect.width || 360;
          this.height = rect.height || 340;
          this.canvas.width = this.width * dpr;
          this.canvas.height = this.height * dpr;
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          this.defenseLineY = this.height - 34;
        }

        /**
         * スタートボタン押下前の待機状態を初期化
         */
        initStandby() {
          this.isPlaying = false;
          this.isGameOver = false;
          this.isCooldown = false;
          this.maxLives = 3;
          this.lives = 3;
          this.currentWaveIndex = 0;
          this.destroyedCount = 0;
          this.totalSpawnedCount = 0;
          this.combo = 0;
          this.maxCombo = 0;
          this.enemies = [];
          this.bullets = [];
          this.particles = [];
          this.weakMap = new Map();

          this.startOverlay.classList.remove('hidden');
          this.resultModal.classList.remove('active');
          this.updateHUD();
          this.render();
        }

        /**
         * ゲーム状態を初期状態にリセットして開始
         */
        resetGame() {
          if (this.rafId) {
            cancelAnimationFrame(this.rafId);
            this.rafId = null;
          }
          if (this.cooldownTimer) {
            clearTimeout(this.cooldownTimer);
            this.cooldownTimer = null;
          }
          this.keypadGrid.classList.remove('cooldown');
          this.resultModal.classList.remove('active');
          this.startOverlay.classList.add('hidden');

          this.isPlaying = true;
          this.maxLives = 3;
          this.lives = 3;
          this.currentWaveIndex = 0;
          this.destroyedCount = 0;
          this.totalSpawnedCount = 0;
          this.totalPlannedCount = this.waveConfigs.reduce((sum, w) => sum + w.count, 0);
          this.combo = 0;
          this.maxCombo = 0;
          this.isGameOver = false;
          this.isCooldown = false;

          this.enemies = [];
          this.bullets = [];
          this.particles = [];
          this.weakMap = new Map();

          this.setupWave(0);
          this.updateHUD();

          this.lastTimestamp = performance.now();
          this.rafId = requestAnimationFrame((ts) => this.gameLoop(ts));
        }

        /**
         * 指定Waveの出題キューを生成
         */
        setupWave(waveIndex) {
          this.currentWaveIndex = waveIndex;
          const config = this.waveConfigs[waveIndex];

          // 出題プールのフィルタリング
          // Wave 1（index === 0）は 0°〜90° のみ（tan 90° の未定義は Wave 2 以降）
          let pool;
          if (waveIndex === 0) {
            pool = this.masterQuestions.filter(
              (q) => q.angle <= 90 && !(q.func === 'tan' && q.angle === 90)
            );
          } else {
            pool = [...this.masterQuestions];
          }

          // Waveの出題数分をバランスよくシャッフル生成
          this.waveQueue = [];
          let shuffled = this.shuffleArray([...pool]);
          for (let i = 0; i < config.count; i++) {
            if (shuffled.length === 0) {
              shuffled = this.shuffleArray([...pool]);
            }
            this.waveQueue.push(shuffled.pop());
          }

          this.spawnTimer = 600; // Wave開始直後の初回スポーン待機(ms)
          this.waveTransitionTimer = 0;
          this.showWaveBanner(config.wave, config.desc);
          this.updateHUD();
        }

        /**
         * 配列のシャッフル（Fisher-Yates）
         */
        shuffleArray(arr) {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        }

        /**
         * Wave開始バナー表示
         */
        showWaveBanner(waveNum, subtitle) {
          if (this.bannerTimer) clearTimeout(this.bannerTimer);
          this.bannerTitleEl.textContent = `WAVE ${waveNum} / ${this.waveConfigs.length}`;
          this.bannerSubEl.textContent = subtitle;
          this.bannerEl.classList.add('visible');
          this.bannerTimer = setTimeout(() => {
            this.bannerEl.classList.remove('visible');
          }, 1600);
        }

        /**
         * 敵のスポーン処理
         */
        spawnEnemy() {
          if (this.waveQueue.length === 0) return;
          const q = this.waveQueue.shift();
          const config = this.waveConfigs[this.currentWaveIndex];

          const boxWidth = 104;
          const boxHeight = 40;
          const margin = boxWidth / 2 + 14;
          const usableWidth = Math.max(40, this.width - margin * 2);
          const x = margin + Math.random() * usableWidth;

          this.enemies.push({
            question: q,
            x,
            y: -boxHeight / 2,
            width: boxWidth,
            height: boxHeight,
            speed: config.speed + (Math.random() * 3 - 1.5),
            targeted: false
          });
          this.totalSpawnedCount++;
        }

        /**
         * キーパッド入力時の迎撃判定
         */
        handleInput(value) {
          if (!this.isPlaying || this.isGameOver || this.isCooldown) return;

          // 画面上の未迎撃の敵から、解答値が一致するものを抽出
          const matchingEnemies = this.enemies.filter(
            (e) => !e.targeted && e.question.answer === value
          );

          if (matchingEnemies.length > 0) {
            // 複数いる場合は最も防衛ラインに近い（y座標が最大の）敵を優先
            matchingEnemies.sort((a, b) => b.y - a.y);
            const target = matchingEnemies[0];
            target.targeted = true;

            this.combo++;
            if (this.combo > this.maxCombo) {
              this.maxCombo = this.combo;
            }
            this.destroyedCount++;

            // 砲台からターゲットへ向かう弾丸を生成
            const turretX = this.width / 2;
            const turretY = this.defenseLineY;
            this.bullets.push({
              startX: turretX,
              startY: turretY,
              x: turretX,
              y: turretY,
              targetEnemy: target,
              progress: 0,
              duration: 110 // msで即座に着弾
            });

            this.updateHUD();
          } else {
            // 一致する敵が画面上に1体もいない場合（誤答）
            this.handleMistake();
          }
        }

        /**
         * 誤答ペナルティ処理（振動・赤フラッシュ・コンボリセット・0.4秒クールダウン）
         */
        handleMistake() {
          this.combo = 0;
          this.updateHUD();
          this.triggerDamageEffect();

          // 誤答時に画面上で最も防衛ラインに近い敵を「苦手だった三角比」として記録
          const activeEnemies = this.enemies.filter((e) => !e.targeted);
          if (activeEnemies.length > 0) {
            activeEnemies.sort((a, b) => b.y - a.y);
            const frontQuestion = activeEnemies[0].question;
            this.recordWeakQuestion(frontQuestion);
          }

          // 0.4秒間キーパッド全体を無効化
          this.isCooldown = true;
          this.keypadGrid.classList.add('cooldown');
          if (this.cooldownTimer) clearTimeout(this.cooldownTimer);
          this.cooldownTimer = setTimeout(() => {
            this.isCooldown = false;
            this.keypadGrid.classList.remove('cooldown');
          }, 400);
        }

        /**
         * 苦手問題の記録
         */
        recordWeakQuestion(q) {
          if (!q) return;
          this.weakMap.set(q.label, `${q.label} = ${q.answer}`);
        }

        /**
         * 画面の振動＆赤フラッシュ演出
         */
        triggerDamageEffect() {
          this.flashOverlay.classList.add('active');
          setTimeout(() => {
            this.flashOverlay.classList.remove('active');
          }, 160);

          this.appEl.classList.remove('shake');
          void this.appEl.offsetWidth; // リフローでアニメーション再発火
          this.appEl.classList.add('shake');

          if (navigator.vibrate) {
            navigator.vibrate(60);
          }
        }

        /**
         * 敵撃破時のパーティクル生成
         */
        spawnExplosion(x, y, color) {
          for (let i = 0; i < 12; i++) {
            const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.3;
            const speed = 50 + Math.random() * 90;
            this.particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 1,
              color
            });
          }
        }

        /**
         * ヘッダー表示の更新
         */
        updateHUD() {
          const waveNum = this.waveConfigs[this.currentWaveIndex].wave;
          this.waveDisplay.textContent = `Wave ${waveNum}/${this.waveConfigs.length}`;

          // ライフ表示（♥♥♥）
          const hearts = this.lifeDisplay.querySelectorAll('.td-heart');
          hearts.forEach((heart, idx) => {
            if (idx < this.lives) {
              heart.classList.remove('lost');
            } else {
              heart.classList.add('lost');
            }
          });

          // プレイ中の現在スコア（撃破数×100 + 最大コンボ×50）
          const currentScore = this.destroyedCount * 100 + this.maxCombo * 50;
          this.scoreDisplay.textContent = currentScore.toLocaleString();

          if (this.combo >= 2) {
            this.comboBadge.textContent = `${this.combo} COMBO`;
            this.comboBadge.classList.add('active');
          } else {
            this.comboBadge.classList.remove('active');
          }
        }

        /**
         * メインゲームループ
         */
        gameLoop(timestamp) {
          if (this.isGameOver) return;
          const dtMs = Math.min(timestamp - this.lastTimestamp, 50);
          const dtSec = dtMs / 1000;
          this.lastTimestamp = timestamp;

          this.update(dtMs, dtSec);
          this.render();

          if (!this.isGameOver) {
            this.rafId = requestAnimationFrame((ts) => this.gameLoop(ts));
          }
        }

        /**
         * 状態更新処理
         */
        update(dtMs, dtSec) {
          const config = this.waveConfigs[this.currentWaveIndex];

          // 1. スポーン管理
          if (this.waveQueue.length > 0) {
            this.spawnTimer -= dtMs;
            if (this.spawnTimer <= 0) {
              this.spawnEnemy();
              this.spawnTimer = config.spawnInterval;
            }
          } else if (this.enemies.length === 0 && this.bullets.length === 0) {
            // Wave内の全敵が処理完了した場合、次Waveまたはクリア画面へ遷移
            if (this.currentWaveIndex < this.waveConfigs.length - 1) {
              this.waveTransitionTimer += dtMs;
              if (this.waveTransitionTimer >= 700) {
                this.setupWave(this.currentWaveIndex + 1);
              }
            } else {
              this.finishGame(true);
              return;
            }
          }

          // 2. 弾丸の移動・着弾判定
          for (let i = this.bullets.length - 1; i >= 0; i--) {
            const b = this.bullets[i];
            b.progress += dtMs / b.duration;
            if (b.progress >= 1) {
              const target = b.targetEnemy;
              const idx = this.enemies.indexOf(target);
              if (idx !== -1) {
                this.spawnExplosion(target.x, target.y, '#38bdf8');
                this.enemies.splice(idx, 1);
              }
              this.bullets.splice(i, 1);
            } else {
              b.x = b.startX + (b.targetEnemy.x - b.startX) * b.progress;
              b.y = b.startY + (b.targetEnemy.y - b.startY) * b.progress;
            }
          }

          // 3. 敵の落下と防衛ライン突破判定
          for (let i = this.enemies.length - 1; i >= 0; i--) {
            const e = this.enemies[i];
            if (e.targeted) continue; // 迎撃弾が向かっている敵はその場で待機

            e.y += e.speed * dtSec;
            if (e.y + e.height / 2 >= this.defenseLineY) {
              // 防衛ライン突破
              this.recordWeakQuestion(e.question);
              this.spawnExplosion(e.x, this.defenseLineY, '#ef4444');
              this.enemies.splice(i, 1);

              this.lives--;
              this.combo = 0;
              this.updateHUD();
              this.triggerDamageEffect();

              if (this.lives <= 0) {
                this.finishGame(false);
                return;
              }
            }
          }

          // 4. パーティクルの更新
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dtSec;
            p.y += p.vy * dtSec;
            p.life -= dtSec * 2.4;
            if (p.life <= 0) {
              this.particles.splice(i, 1);
            }
          }
        }

        /**
         * フィールドの描画処理
         */
        render() {
          const ctx = this.ctx;
          ctx.clearRect(0, 0, this.width, this.height);

          // 1. 防衛ラインの描画
          ctx.save();
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 6]);
          ctx.beginPath();
          ctx.moveTo(0, this.defenseLineY);
          ctx.lineTo(this.width, this.defenseLineY);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = 'rgba(239, 68, 68, 0.75)';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText('DEFENSE LINE', this.width - 10, this.defenseLineY - 6);
          ctx.restore();

          // 2. 迎撃タレット（砲台）の描画
          const turretX = this.width / 2;
          const turretY = this.defenseLineY;
          ctx.save();
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(turretX, turretY + 6, 16, Math.PI, 0);
          ctx.fill();
          ctx.fillStyle = '#e0f2fe';
          ctx.fillRect(turretX - 4, turretY - 12, 8, 14);
          ctx.restore();

          // 3. 敵ユニットの描画
          this.enemies.forEach((e) => {
            const halfW = e.width / 2;
            const halfH = e.height / 2;
            const x = e.x - halfW;
            const y = e.y - halfH;

            // 関数ごとのアクセント色
            let strokeColor = '#38bdf8';
            if (e.question.func === 'cos') strokeColor = '#a78bfa';
            if (e.question.func === 'tan') strokeColor = '#fb923c';

            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2;

            ctx.beginPath();
            if (ctx.roundRect) {
              ctx.roundRect(x, y, e.width, e.height, 8);
            } else {
              ctx.rect(x, y, e.width, e.height);
            }
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 17px "Poppins", "Noto Sans JP", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(e.question.label, e.x, e.y + 1);
            ctx.restore();
          });

          // 4. 迎撃レーザー・弾丸の描画
          this.bullets.forEach((b) => {
            ctx.save();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(b.startX, b.startY - 8);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();

            ctx.fillStyle = '#e0f2fe';
            ctx.beginPath();
            ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });

          // 5. パーティクルの描画
          this.particles.forEach((p) => {
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });
        }

        /**
         * ゲーム終了＆リザルト表示
         */
        finishGame(isClear) {
          this.isPlaying = false;
          this.isGameOver = true;
          if (this.rafId) {
            cancelAnimationFrame(this.rafId);
            this.rafId = null;
          }

          // 総合スコア計算: 撃破数 × 100 + 最大コンボ × 50 + 残りHP × 500
          const remainingHp = Math.max(0, this.lives);
          const totalScore =
            this.destroyedCount * 100 + this.maxCombo * 50 + remainingHp * 500;

          // 判定ランク（S / A / B / C）
          let rank = 'C';
          if (isClear && remainingHp === 3 && totalScore >= 8500) {
            rank = 'S';
          } else if (isClear || totalScore >= 5500) {
            rank = 'A';
          } else if (totalScore >= 2500) {
            rank = 'B';
          }

          this.resultTitle.textContent = isClear ? 'ALL WAVES CLEARED!' : 'GAME OVER';
          this.resultTitle.className = `td-result-status ${isClear ? 'clear' : 'gameover'}`;
          this.resultRank.textContent = rank;
          this.resultTotalScore.textContent = totalScore.toLocaleString();
          this.resultBreakdown.textContent = `撃破: ${this.destroyedCount} / ${this.totalSpawnedCount} | 最大コンボ: ${this.maxCombo} | 残HP: ${remainingHp}`;

          // 苦手だった三角比リストの描画
          this.weakListEl.innerHTML = '';
          if (this.weakMap.size === 0) {
            const li = document.createElement('li');
            li.className = 'td-weak-empty';
            li.textContent = 'ミスなし！すべての三角比を完璧に迎撃しました！';
            this.weakListEl.appendChild(li);
          } else {
            this.weakMap.forEach((text) => {
              const li = document.createElement('li');
              li.className = 'td-weak-item';
              li.textContent = text;
              this.weakListEl.appendChild(li);
            });
          }

          this.resultModal.classList.add('active');
        }
      }

      // 初期化
      document.addEventListener('DOMContentLoaded', () => {
        new TrigTowerDefense();
      });
    })();
  </script>
