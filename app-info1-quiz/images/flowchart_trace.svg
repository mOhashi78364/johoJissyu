<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 440" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="380" height="440" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 1. 開始 -->
  <rect x="130" y="14" width="120" height="32" rx="16" fill="#E2E8F0" stroke="#475569" stroke-width="2.5"/>
  <text x="190" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">開始</text>
  <line x1="190" y1="46" x2="190" y2="66" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2. ひし形1：18歳以上か？ -->
  <polygon points="190,68 272,104 190,140 108,104" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="190" y="109" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">18歳以上か？</text>

  <!-- Yes (左) -->
  <text x="82" y="96" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">Yes</text>
  <polyline points="108,104 80,104 80,152" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="20" y="154" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="80" y="177" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">料金 = 2000円</text>

  <!-- No (右) -->
  <text x="298" y="96" font-family="sans-serif" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">No</text>
  <polyline points="272,104 300,104 300,152" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="240" y="154" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="300" y="177" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">料金 = 1000円</text>

  <!-- 合流 → ひし形2 -->
  <polyline points="80,190 80,214 300,214 300,190" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="190" y1="214" x2="190" y2="234" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. ひし形2：クーポンあり？ -->
  <polygon points="190,236 276,272 190,308 104,272" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="190" y="277" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">クーポンあり？</text>

  <!-- Yes (左) -->
  <text x="80" y="264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">Yes</text>
  <polyline points="104,272 80,272 80,316" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="16" y="318" width="136" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="84" y="341" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">料金から300円引く</text>

  <!-- No (右) -->
  <text x="300" y="264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">No</text>
  <polyline points="276,272 300,272 300,372 190,372" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Yes側も合流 -->
  <polyline points="84,354 84,372 190,372" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="190" y1="372" x2="190" y2="390" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4. 終了 -->
  <rect x="105" y="392" width="170" height="34" rx="17" fill="#E2E8F0" stroke="#475569" stroke-width="2.5"/>
  <text x="190" y="414" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">料金を支払って終了</text>
</svg>
