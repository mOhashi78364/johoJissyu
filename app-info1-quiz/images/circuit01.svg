<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="100%">
  <rect width="420" height="180" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- 入力ラベル -->
  <text x="28" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1E3A8A" text-anchor="middle">A</text>
  <text x="28" y="126" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1E3A8A" text-anchor="middle">B</text>

  <!-- 入力線 -->
  <line x1="48" y1="60" x2="115" y2="60" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="48" y1="120" x2="115" y2="120" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ANDゲート -->
  <path d="M 115 35 L 155 35 A 45 55 0 0 1 155 145 L 115 145 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="150" y="96" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E3A8A" text-anchor="middle">AND</text>

  <!-- 中間接続線 -->
  <line x1="196" y1="90" x2="245" y2="90" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>

  <!-- NOTゲート -->
  <polygon points="245,50 245,130 315,90" fill="#FEE2E2" stroke="#DC2626" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="324" cy="90" r="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="3.5"/>
  <text x="272" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991B1B" text-anchor="middle">NOT</text>

  <!-- 出力線とラベル -->
  <line x1="332" y1="90" x2="375" y2="90" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <text x="394" y="97" font-family="sans-serif" font-size="20" font-weight="bold" fill="#DC2626" text-anchor="middle">Y</text>
</svg>
