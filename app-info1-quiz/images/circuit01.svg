<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="100%" height="100%">
  <rect width="460" height="220" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 入力ラベル -->
  <text x="26" y="55" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1E3A8A" text-anchor="middle">A</text>
  <text x="26" y="103" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1E3A8A" text-anchor="middle">B</text>

  <!-- 入力Aの配線と分岐点 -->
  <line x1="46" y1="48" x2="155" y2="48" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="84" cy="48" r="5" fill="#334155"/>
  <polyline points="84,48 84,162 155,162" fill="none" stroke="#334155" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 入力Bの配線 -->
  <line x1="46" y1="96" x2="155" y2="96" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 上側：ANDゲート（文字なし） -->
  <path d="M 155 32 L 195 32 A 40 40 0 0 1 195 112 L 155 112 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 下側：NOTゲート（文字なし） -->
  <polygon points="155,134 155,190 212,162" fill="#FEE2E2" stroke="#DC2626" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="220" cy="162" r="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="3.5"/>

  <!-- 中間配線（AND出力・NOT出力 → OR入力） -->
  <polyline points="235,72 268,72 268,94 306,94" fill="none" stroke="#334155" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="227,162 268,162 268,140 306,140" fill="none" stroke="#334155" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 右側：ORゲート（文字なし） -->
  <path d="M 294 72 Q 320 117 294 162 L 336 162 Q 374 162 392 117 Q 374 72 336 72 Z" fill="#D1FAE5" stroke="#059669" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 出力線とラベル -->
  <line x1="392" y1="117" x2="424" y2="117" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <text x="440" y="124" font-family="sans-serif" font-size="20" font-weight="bold" fill="#DC2626" text-anchor="middle">Y</text>
</svg>
