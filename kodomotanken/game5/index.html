<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いろタッチ</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        body { background-color: var(--baseColor); text-align: center; padding: 20px; }
        h1 { color: var(--main); font-size: 2rem; }
        select { font-size: 1.5rem; padding: 10px; margin: 15px 0; width: 80%; }
        #game-screen, #ready-screen { display: none; }
        #color-circle { width: 140px; height: 140px; border-radius: 50%; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #touch-btn { font-size: 1.8rem; padding: 15px 40px; background-color: var(--main); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #result { font-size: 1.8rem; font-weight: bold; margin-top: 15px; min-height: 40px; }
    </style>
</head>
<body>

    <div id="setup-screen" class="setup-box">
        <h2>みんなどこの班（はん）かな？</h2>
        <select id="group-select">
            <option value="1">うさぎ班（はん）</option>
            <option value="2">ひつじ班（はん）</option>
            <option value="3">たぬき班（はん）</option>
        </select>
        <br>
        <button class="nav-btn" onclick="startGame()">ゲームスタート！</button>
    </div>

    <div id="ready-screen" class="ready-box">
        <h2 id="ready-title" style="color: #EF4444;">1回目の チャレンジ！</h2>
        <p>こうたいして じゅんびしてね！<br>じゅんびができたら ボタンを おそう！</p>
        <button class="nav-btn" onclick="startRound()">スタート！</button>
    </div>

    <div id="game-screen">
        <h1>あおで タッチ！</h1>
        <p>3人で 合計（ごうけい）3回 成功したら クリアだよ！ （いま <span id="stage-num" style="color:#EF4444; font-size:1.8rem; font-weight:bold;">1</span> / 3 回目）</p>
        <div id="color-circle"></div>
        <button id="touch-btn">いまおす！</button>
        <div id="result"></div>

        <div id="hint" class="hint-box">
            🎉ぜんぶの ミニゲームを クリアしたよ！<br>
            <span style="font-size:1.1rem; color:#555;">※さいごの文字を メモしよう！</span><br>
            ひみつの文字： <div id="key-char" class="keyword-display"></div><br><br>
            👑【さいごの ゴール】👑：<br>
            <span style="color: #D97706;" id="hint-text"></span>
        </div>
    </div>

    <script>
        const routeData = {
            "1": { hint: "あつめた 5つの もじを こうこうせいに おしえてね！", char: "ぼ" },
            "2": { hint: "あつめた 5つの もじを こうこうせいに おしえてね！", char: "り" },
            "3": { hint: "あつめた 5つの もじを こうこうせいに おしえてね！", char: "り" }
        };

        let selectedGroup = "1";
        const circle = document.getElementById('color-circle');
        const result = document.getElementById('result');
        const stageText = document.getElementById('stage-num');
        const colors = ['#EF4444', '#F59E0B', '#10B981', '#2563EB']; 
        let currentColorIndex = 0;
        let countSuccess = 0;
        let timer;
        let isScreenActive = false;

        function startGame() {
            selectedGroup = document.getElementById('group-select').value;
            document.getElementById('setup-screen').style.display = 'none';
            showReadyScreen();
        }

        function showReadyScreen() {
            isScreenActive = false;
            clearTimeout(timer);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('ready-screen').style.display = 'block';
            document.getElementById('ready-title').textContent = `${countSuccess + 1}回目の チャレンジ！`;
        }

        function startRound() {
            document.getElementById('ready-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            stageText.textContent = countSuccess + 1;
            result.textContent = "";
            isScreenActive = true;
            changeColor();
        }

        function changeColor() {
            if (!isScreenActive || countSuccess >= 3) return;
            currentColorIndex = Math.floor(Math.random() * colors.length);
            circle.style.backgroundColor = colors[currentColorIndex];
            
            // ★ランダムな交代時間の最小値を 600ms 〜 最大 1400ms に設定
            let randomTime = Math.floor(Math.random() * 800) + 600;
            timer = setTimeout(changeColor, randomTime); 
        }

        document.getElementById('touch-btn').addEventListener('click', () => {
            if (!isScreenActive || countSuccess >= 3) return;

            if (colors[currentColorIndex] === '#2563EB') {
                countSuccess++; // ★失敗してもリセットせず、カウントを足し算するだけに変更
                result.innerHTML = '<span style="color: #10B981;">⭕️ ナイス！</span>';
                isScreenActive = false;
                clearTimeout(timer);
                
                if(countSuccess === 3) {
                    stageText.textContent = "3";
                    document.getElementById('hint-text').textContent = routeData[selectedGroup].hint;
                    document.getElementById('key-char').textContent = routeData[selectedGroup].char;
                    document.getElementById('hint').style.display = 'block';
                } else {
                    setTimeout(() => { showReadyScreen(); }, 1000);
                }
            } else {
                result.innerHTML = '<span style="color: #EF4444;">❌ あおじゃなかった！もういちど 交代してチャレンジ！</span>';
                isScreenActive = false;
                clearTimeout(timer);
                setTimeout(() => { showReadyScreen(); }, 1500);
            }
        });
    </script>
</body>
</html>
