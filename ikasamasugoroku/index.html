<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>すごろくゲーム</title>
    <style>
        /* --- カラーパレット設定（ポータルサイトと統一） --- */
        :root {
            --textColor: #374151;   /* 文字色 */
            --mainColor: #2563EB;   /* メインカラー: ボタン等 */
            --subColor1: #DBEAFE;   /* サブカラー1: 背景アクセント */
            --subColor2: #1E3A8A;   /* サブカラー2: 強調・ボーダー */
            --accentColor: #EF4444; /* アクセントカラー: ゴール・サイコロ */
            --baseColor: #F0F2F5;   /* ベースカラー: 背景 */
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--baseColor);
            color: var(--textColor);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }

        h1 {
            color: var(--subColor2);
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        p.description {
            margin-bottom: 2rem;
            color: #666;
            font-size: 0.95rem;
        }

        /* --- レイアウトコンテナ --- */
        .main-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            flex-wrap: wrap; /* スマホで折り返す設定 */
        }

        /* 各セクションの共通スタイル */
        .section-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 4px solid var(--subColor2); /* デザインの統一 */
        }

        /* --- 1. ゲームボード (左) --- */
        #board-section {
            flex: 2;
            min-width: 300px;
            /* スマホで幅が狭くなった時の対応 */
            max-width: 100%; 
            box-sizing: border-box;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5列維持 */
            gap: 8px;
            width: 100%;
        }

        .cell {
            background-color: white;
            border: 2px solid var(--subColor1);
            border-radius: 8px;
            height: 60px; /* 少し大きく */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--subColor2);
            position: relative;
            font-size: 1.1rem;
        }

        /* スタートとゴールの色分け */
        .cell.start { 
            background-color: var(--subColor2); 
            color: white; 
            border-color: var(--subColor2);
        }
        .cell.goal { 
            background-color: var(--accentColor); 
            color: white; 
            border-color: var(--accentColor);
        }

        /* --- 2. コントロールパネル (中央) --- */
        #control-section {
            flex: 1;
            min-width: 250px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        #dice-display {
            font-size: 4rem;
            font-weight: bold;
            margin: 15px 0;
            height: 80px;
            color: var(--accentColor); /* サイコロを目立たせる */
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 0px var(--subColor1);
        }

        button {
            background-color: var(--mainColor);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 999px; /* 丸みのあるボタン */
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
            width: 100%;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        button:hover { 
            background-color: var(--subColor2); 
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(37, 99, 235, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }

        button:disabled { 
            background-color: #cbd5e1; 
            cursor: not-allowed; 
            box-shadow: none;
            transform: none;
        }

        .status-text { 
            margin: 10px 0; 
            font-size: 1.1rem; 
            font-weight: bold;
            color: var(--textColor);
        }
        
        #turns-left {
            color: var(--mainColor);
            font-size: 1.4rem;
        }

        #message { 
            font-weight: bold; 
            min-height: 1.5em; 
            color: var(--accentColor); 
            margin-top: 15px; 
        }

        /* --- 3. 統計パネル (右) --- */
        #stats-section {
            flex: 1;
            min-width: 200px;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.9rem; 
        }
        
        th, td { 
            border-bottom: 1px solid var(--subColor1); 
            padding: 12px 8px; 
            text-align: center; 
        }
        
        th { 
            background-color: var(--subColor1); 
            color: var(--subColor2);
        }
        
        td {
            color: var(--textColor);
        }

        /* プレイヤーのコマ */
        #player {
            width: 30px;
            height: 30px;
            background-color: var(--subColor2); /* 濃い青で見やすく */
            border-radius: 50%;
            position: absolute;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 3px solid white; /* 白枠をつけて視認性アップ */
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); /* なめらかな動き */
        }

        /* --- スマホ対応レスポンシブ設定 --- */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.5rem;
            }

            /* コンテナ内の要素を縦積みにし、幅を100%にする */
            .main-container {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            #board-section, #control-section, #stats-section {
                min-width: auto;
                width: 100%;
            }

            /* 盤面のセルサイズ調整 */
            .cell {
                height: 50px; /* 少し小さく */
                font-size: 1rem;
            }
            
            #game-board {
                gap: 5px;
            }
        }

    </style>
</head>
<body>

    <h1>挑戦！20マスすごろく</h1>
    <p class="description">チャンスは6回。20マス先のゴールを目指せ！</p>

    <div class="main-container">

        <div id="board-section" class="section-box">
            <div id="game-board"></div>
        </div>

        <div id="control-section" class="section-box">
            <div class="status-text">残り回数: <span id="turns-left">6</span></div>
            <div id="dice-display">🎲</div>
            <button id="roll-btn" onclick="rollDice()">サイコロを振る</button>
            <button id="reset-btn" onclick="initGame()" style="display:none; margin-top:10px; background-color:#6B7280;">もう一度</button>
            <div id="message"></div>
        </div>

        <div id="stats-section" class="section-box">
            <table>
                <tr><th>出目</th><th>回数</th></tr>
                <tr><th>1</th><td id="count-1">0</td></tr>
                <tr><th>2</th><td id="count-2">0</td></tr>
                <tr><th>3</th><td id="count-3">0</td></tr>
                <tr><th>4</th><td id="count-4">0</td></tr>
                <tr><th>5</th><td id="count-5">0</td></tr>
                <tr><th>6</th><td id="count-6">0</td></tr>
            </table>
        </div>

    </div>

    <div id="player" style="display:none;"></div>

<script>
    // --- ロジックは元のまま変更なし ---

    // 設定
    const TOTAL_CELLS = 20;
    const MAX_TURNS = 6;
    
    // 状態変数
    let playerPosition = 0;
    let turnsLeft = MAX_TURNS;
    let isAnimating = false;
    let diceCounts = [0, 0, 0, 0, 0, 0];

    // DOM要素
    const boardEl = document.getElementById('game-board');
    const diceDisplayEl = document.getElementById('dice-display');
    const turnsLeftEl = document.getElementById('turns-left');
    const messageEl = document.getElementById('message');
    const rollBtn = document.getElementById('roll-btn');
    const resetBtn = document.getElementById('reset-btn');
    const playerEl = document.getElementById('player');

    // 初期化処理
    function initGame() {
        playerPosition = 0;
        turnsLeft = MAX_TURNS;
        diceCounts = [0, 0, 0, 0, 0, 0]; 
        
        isAnimating = false;
        
        // UI更新
        updateStats();
        turnsLeftEl.innerText = turnsLeft;
        diceDisplayEl.innerText = '🎲';
        messageEl.innerText = '';
        rollBtn.disabled = false;
        resetBtn.style.display = 'none';

        createBoard();
        
        // 少し待ってからコマを表示（レイアウト確定待ち）
        setTimeout(() => {
            playerEl.style.display = 'block';
            movePlayerVisual(0);
        }, 100);
    }

    // ボード生成
    function createBoard() {
        boardEl.innerHTML = '';
        // 0から20まで、合計21マス
        for (let i = 0; i <= TOTAL_CELLS; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `cell-${i}`;
            
            if (i === 0) {
                cell.classList.add('start');
                cell.innerText = 'S';
            } else if (i === TOTAL_CELLS) {
                cell.classList.add('goal');
                cell.innerText = 'G';
            } else {
                cell.innerText = i;
            }
            boardEl.appendChild(cell);
        }
    }

    // プレイヤーの表示位置更新
    function movePlayerVisual(pos) {
        const targetPos = pos > TOTAL_CELLS ? TOTAL_CELLS : pos;
        const targetCell = document.getElementById(`cell-${targetPos}`);
        
        if (!targetCell) return;

        const rect = targetCell.getBoundingClientRect();
        
        const scrollX = window.scrollX || window.pageXOffset;
        const scrollY = window.scrollY || window.pageYOffset;

        // コマの中心をセルの中心に合わせる（コマのサイズ30pxの半分=15pxを引く）
        playerEl.style.left = (rect.left + scrollX + (rect.width / 2) - 15) + 'px';
        playerEl.style.top = (rect.top + scrollY + (rect.height / 2) - 15) + 'px';
    }

    // サイコロを振る処理
    function rollDice() {
        if (isAnimating || turnsLeft <= 0) return;
        
        isAnimating = true;
        rollBtn.disabled = true;

        let count = 0;
        const interval = setInterval(() => {
            diceDisplayEl.innerText = Math.floor(Math.random() * 6) + 1;
            count++;
            if (count > 10) {
                clearInterval(interval);
                determineResult();
            }
        }, 80);
    }

    // 結果決定ロジック（確率操作：1が50%）
    function determineResult() {
        const r = Math.random();
        let result;

        // 【確率設定】 
        // 1が出る確率: 50% (0.0 <= r < 0.5)
        // 2~6が出る確率: 残り50%を5等分 => 各10% (0.1)
        if (r < 0.50) {
            result = 1;
        } else if (r < 0.60) {
            result = 2;
        } else if (r < 0.70) {
            result = 3;
        } else if (r < 0.80) {
            result = 4;
        } else if (r < 0.90) {
            result = 5;
        } else {
            result = 6;
        }

        // 結果表示とデータ更新
        diceDisplayEl.innerText = result;
        diceCounts[result - 1]++;
        updateStats();

        // ゲーム進行
        turnsLeft--;
        turnsLeftEl.innerText = turnsLeft;
        playerPosition += result;
        
        movePlayerVisual(playerPosition);

        checkGameStatus();
        
        isAnimating = false;
        if (turnsLeft > 0 && playerPosition < TOTAL_CELLS) {
            rollBtn.disabled = false;
        }
    }

    // 勝利判定
    function checkGameStatus() {
        if (playerPosition >= TOTAL_CELLS) {
            messageEl.innerText = "ゴール！🎉";
            messageEl.style.color = "var(--mainColor)"; /* 成功色はメインカラーで */
            endGame();
        } else if (turnsLeft === 0) {
            messageEl.innerText = "残念...😢";
            messageEl.style.color = "var(--accentColor)"; /* 失敗色はアクセント(赤)で */
            endGame();
        }
    }

    function endGame() {
        rollBtn.disabled = true;
        resetBtn.style.display = 'block';
    }

    function updateStats() {
        for(let i=1; i<=6; i++) {
            document.getElementById(`count-${i}`).innerText = diceCounts[i-1];
        }
    }

    window.onload = () => {
        initGame();
        // 画面サイズが変わった時にコマの位置を再計算する
        window.addEventListener('resize', () => movePlayerVisual(playerPosition));
    };

</script>
</body>
</html>
